name: Bug report
description: Report a reproducible problem without including private device data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve OpenDevice Forge. Remove serial numbers, account details, personal files, and other identifiers from screenshots and logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop interface
        - Device discovery or read-only inspection
        - Plugin lifecycle
        - Layout profiles
        - Product site
        - Packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a short commit id
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPU architecture, Android version, and whether the data source was live, public reference, or demo.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest repeatable path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed serial numbers, account data, personal files, tokens, and other secrets.
          required: true
