[package]
name = "opendevice-forge"
version = "0.1.0"
description = "Plugin-first Android device workbench"
edition = "2024"
rust-version = "1.88"

[lib]
name = "opendevice_forge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
jsonschema = { version = "0.52.0", default-features = false }
p256 = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
wait-timeout = "0.2.1"
